[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b0f17"
secondaryBackgroundColor = "#121620"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
